#cloud-config

package_update: true
package_upgrade: false

packages:
  - docker.io
  - nginx

write_files:
  - path: /etc/nginx/sites-available/skillswap-api
    owner: root:root
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;

          client_max_body_size 20m;

          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

runcmd:
  - [bash, -lc, 'systemctl enable --now docker']
  - [bash, -lc, 'usermod -aG docker __ADMIN_USERNAME__']
  - [bash, -lc, 'rm -f /etc/nginx/sites-enabled/default']
  - [bash, -lc, 'ln -sfn /etc/nginx/sites-available/skillswap-api /etc/nginx/sites-enabled/skillswap-api']
  - [bash, -lc, 'nginx -t && systemctl enable --now nginx && systemctl reload nginx']
  - [bash, -lc, 'if ! swapon --show=NAME --noheadings | grep -qx /swapfile; then fallocate -l 2G /swapfile; chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile; fi']
  - [bash, -lc, 'grep -q "^/swapfile " /etc/fstab || echo "/swapfile none swap sw 0 0" >> /etc/fstab']

final_message: "SkillSwap VM base provisioning completed."
